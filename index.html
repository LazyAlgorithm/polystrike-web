<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1A24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ringfall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root {
	--ground: #0E1A24;
	--ink: #E8EEF2;
	--quiet: #7C8F9E;
	--signal: #F2B33D;
	--track: #22323F;
	--fault: #F07167;
}
* { box-sizing: border-box; }
html, body {
	margin: 0; height: 100%; overflow: hidden;
	background: var(--ground); color: var(--ink);
	font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none; user-select: none;
	overscroll-behavior: none;
}
/* The game draws into this; SDL follows its CSS size. */
#canvas {
	position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
	display: block; border: 0; outline: none; touch-action: none;
	background: #000;
}
#gate {
	position: fixed; inset: 0; z-index: 2;
	display: grid; place-items: center;
	padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
	background: var(--ground);
	transition: opacity .35s ease;
}
#gate.ready { background: rgba(14, 26, 36, .72); cursor: pointer; }
#gate.gone { opacity: 0; pointer-events: none; }
.plate { width: min(420px, 100%); text-align: left; }
.plate img { width: 64px; height: 64px; border-radius: 14px; display: block; margin-bottom: 20px; }
.plate h1 {
	margin: 0 0 28px; font-size: clamp(40px, 9vw, 64px); line-height: 1; font-weight: 800;
	letter-spacing: -.02em; font-stretch: condensed;
}
.bar { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--signal); transition: width .2s linear; }
#status { margin: 12px 0 0; color: var(--quiet); font-size: 15px; min-height: 1.5em; }
#gate.ready .bar { display: none; }
#gate.ready #status { color: var(--ink); font-size: 20px; font-weight: 600; }
#gate.failed #status { color: var(--fault); }
#gate.failed .bar i { background: var(--fault); }
.hint { margin: 6px 0 0; color: var(--quiet); font-size: 14px; display: none; }
#gate.ready .hint.show { display: block; }
@media (prefers-reduced-motion: reduce) {
	#gate, .bar i { transition: none; }
}
</style>
</head>
<body>
<script src="tessera-net.js"></script>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="gate" role="button" tabindex="0" aria-live="polite">
	<div class="plate">
		<img src="icon.png" alt="" onerror="this.remove()">
		<h1>Ringfall</h1>
		<div class="bar"><i id="fill"></i></div>
		<p id="status">Loading</p>
		<p class="hint" id="hint">For full screen, use your browser's Share menu and choose Add to Home Screen.</p>
	</div>
</div>
<script>
(() => {
	const gate = document.getElementById("gate");
	const fill = document.getElementById("fill");
	const status = document.getElementById("status");
	const canvas = document.getElementById("canvas");
	const PACK = "game.tpak";
	const SAVE_FOLDER = "/libsdl";
	const ua = navigator.userAgent || "";
	const iPhone = /iPhone|iPod/.test(ua);
	const touch = (navigator.maxTouchPoints || 0) > 0;
	const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

	const show = (text, fraction) => {
		status.textContent = text;
		if (fraction !== undefined) fill.style.width = Math.round(Math.min(Math.max(fraction, 0), 1) * 100) + "%";
	};
	const fail = (text) => {
		gate.classList.remove("ready", "gone");
		gate.classList.add("failed");
		show(text);
	};

	if (!document.createElement("canvas").getContext("webgl2")) {
		fail("This browser can't run the game: it needs WebGL 2. Try a current Chrome, Edge, Firefox or Safari.");
		return;
	}

	// Saved files (settings, unlocks) live in the browser's storage, written through every few seconds and when
	// the page is hidden.
	let saving = false, saveAgain = false;
	const persist = () => {
		if (typeof FS === "undefined" || !FS.syncfs) return;
		if (saving) { saveAgain = true; return; }
		saving = true;
		FS.syncfs(false, () => { saving = false; if (saveAgain) { saveAgain = false; persist(); } });
	};

	// The asset pack streams in with a progress bar, then goes into the game's file system beside the program.
	const loadPack = () => fetch(PACK).then((response) => {
		if (!response.ok) throw new Error(`The game data (${PACK}) could not be loaded: ${response.status}.`);
		const total = Number(response.headers.get("Content-Length")) || 0;
		if (!response.body || !total) return response.arrayBuffer();
		const reader = response.body.getReader();
		const parts = [];
		let received = 0;
		const pump = () => reader.read().then(({ done, value }) => {
			if (done) {
				const all = new Uint8Array(received);
				let at = 0;
				for (const part of parts) { all.set(part, at); at += part.length; }
				return all.buffer;
			}
			parts.push(value);
			received += value.length;
			show("Loading", 0.1 + 0.85 * received / total);
			return pump();
		});
		return pump();
	});
	const pack = PACK ? loadPack() : Promise.resolve(null);

	window.Module = {
		canvas,
		// The same switches as the desktop game, from the address: ?arg=--host&arg=--bots&arg=3 (for testing).
		arguments: new URLSearchParams(location.search).getAll("arg"),
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
		preRun: [() => {
			addRunDependency("tessera-files");
			FS.mkdir(SAVE_FOLDER);
			FS.mount(IDBFS, {}, SAVE_FOLDER);
			const restored = new Promise((resolve) => FS.syncfs(true, () => resolve()));
			Promise.all([pack, restored]).then(([data]) => {
				if (data) FS.writeFile("/" + PACK, new Uint8Array(data));
				show("Starting", 0.97);
				removeRunDependency("tessera-files");
			}).catch((error) => fail(error.message));
		}],
		tesseraPersist: persist,
		tesseraReady: () => {
			show("Tap to play", 1);
			gate.classList.add("ready");
			if (iPhone && !standalone) document.getElementById("hint").classList.add("show");
		},
		onAbort: (what) => fail("The game stopped: " + what + ". Reload the page to try again."),
	};
	setInterval(persist, 5000);
	addEventListener("pagehide", persist);
	document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });

	// The browser lets a page play sound and fill the screen only after a tap or click.
	const play = () => {
		if (!gate.classList.contains("ready")) return;
		gate.classList.add("gone");
		canvas.focus();
		if (touch && !iPhone && document.documentElement.requestFullscreen)
			document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
		if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
	};
	// On press rather than click: a game that locks the mouse takes it during the press, and the click never comes.
	gate.addEventListener("pointerdown", play);
	gate.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") play(); });

	const script = document.createElement("script");
	script.src = "Ringfall.js";
	script.onerror = () => fail("The game could not be loaded. Check your connection and reload the page.");
	document.body.appendChild(script);
})();
</script>
</body>
</html>
